name: Validate app

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
      # Build-only placeholders; this job never signs in or calls the backend.
      EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: build-only-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run doctor
      - run: npm ls --all --omit=optional
      # Keep Hermes enabled: a JS-only export missed the old Supabase regression.
      - run: npm run export:native
      # Run last so advisories do not prevent bundle verification; keep the gate failing.
      # Unpatched braces/node-forge advisories are documented in the audit.
      - run: npm audit --audit-level=high --fetch-retries=1 --fetch-timeout=60000
